<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feel Events - Detalhes do Equipamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Poppins', sans-serif; } html { scroll-behavior: smooth; } .shadow-focus:focus-visible { box-shadow: 0 0 0 3px rgba(34,197,94,0.6); outline: none; } .card-hover { transition: transform .3s ease; } .card-hover:hover { transform: translateY(-6px) scale(1.01); }</style>
</head>
<body class="bg-black text-white">
  <header class="fixed w-full top-0 bg-black/80 backdrop-blur z-50 border-b border-white/10">
    <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
      <a href="/index.html" class="flex items-center gap-3"><img src="/logo.svg" class="h-14 text-white" alt="Feel Events" /></a>
      <a href="/equipamento/" class="text-green-400 font-semibold">Voltar ao catálogo</a>
    </div>
  </header>

  <main class="pt-28 px-6 max-w-4xl mx-auto">
    <div id="item-container" class="bg-gray-900 p-8 rounded-3xl border border-white/10">
      <h1 id="item-name" class="text-4xl font-bold mb-4">Carregando...</h1>
      <p id="item-category" class="text-gray-300 mb-2"></p>
      <p id="item-subcategory" class="text-gray-300 mb-2"></p>
      <p id="item-full-category" class="text-gray-300 mb-2"></p>
      <p id="item-description" class="text-gray-400 mt-4">Aqui poderá encontrar detalhes do equipamento e opções de pedido.</p>
      <a id="item-cta" href="https://wa.me/351965717720" class="inline-block mt-6 bg-green-500 text-black px-6 py-3 rounded-xl font-semibold hover:bg-green-400">Contactar para orçamentar</a>
    </div>
  </main>

  <script>
    const csvUrl = '/Exportar_Equipamento_20260331.csv';
    const searchParam = new URLSearchParams(window.location.search).get('item');

    const getNameFromParam = () => {
      if (!searchParam) return null;
      try { return decodeURIComponent(searchParam); } catch (e) { return searchParam; }
    };

    const unaccent = (t) => (t || '').normalize('NFD').replace(/\p{Diacritic}/gu, '');

    const parseCsv = (text) => {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      return lines.slice(1).map((line) => {
        const [rawName = '', rawPath = ''] = line.split(';');
        const path = rawPath.trim();
        const pathParts = path.split('/').map((p) => p.trim()).filter(Boolean);
        return {
          name: rawName.trim(),
          path,
          category: pathParts[0] || 'Outros',
          subcategory: pathParts[1] || 'Sem subcategoria',
          fullCategory: path || 'Sem categoria',
        };
      }).filter((item) => item.name);
    };

    const showNotFound = () => {
      document.getElementById('item-name').textContent = 'Equipamento não encontrado';
      document.getElementById('item-description').textContent = 'Verifique o link ou escolha outro item no catálogo.';
      document.getElementById('item-cta').textContent = 'Voltar';
      document.getElementById('item-cta').href = '/equipamento/';
    };

    async function loadItem() {
      const itemName = getNameFromParam();
      if (!itemName) { showNotFound(); return; }

      try {
        const res = await fetch(csvUrl);
        const text = await res.text();
        const inventory = parseCsv(text);
        const item = inventory.find((entry) => unaccent(entry.name.toLowerCase()) === unaccent(itemName.toLowerCase()));

        if (!item) { showNotFound(); return; }

        document.getElementById('item-name').textContent = item.name;
        document.getElementById('item-category').textContent = 'Categoria: ' + item.category;
        document.getElementById('item-subcategory').textContent = 'Subcategoria: ' + item.subcategory;
        document.getElementById('item-full-category').textContent = 'Caminho: ' + item.fullCategory;
        document.getElementById('item-description').textContent = 'Este equipamento está disponível no nosso inventário e pode ser reservado agora mesmo.';
        document.getElementById('item-cta').href = 'https://wa.me/351965717720?text=' + encodeURIComponent('Tenho interesse no equipamento: ' + item.name);
      } catch (error) {
        console.error(error);
        showNotFound();
      }
    }

    loadItem();
  </script>
</body>
</html>
